<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Task Manager</h1>
      <section class="form-section">
        <form id="task-form">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required />
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>
          </div>
          <button type="submit">Add Task</button>
        </form>
      </section>
      <section>
        <h2>Tasks</h2>
        <div id="status" class="status"></div>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>
    <template id="task-template">
      <li class="task">
        <div class="task-info">
          <h3 class="task-title"></h3>
          <p class="task-description"></p>
          <p class="task-meta"></p>
        </div>
        <div class="task-actions">
          <button data-action="toggle"></button>
          <button data-action="edit">Edit</button>
          <button data-action="delete" class="danger">Delete</button>
        </div>
      </li>
    </template>
    <dialog id="edit-dialog">
      <form method="dialog" id="edit-form">
        <h3>Edit Task</h3>
        <div class="field">
          <label for="edit-title">Title</label>
          <input id="edit-title" name="title" type="text" required />
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" name="description" rows="3"></textarea>
        </div>
        <div class="field checkbox">
          <input id="edit-completed" name="completed" type="checkbox" />
          <label for="edit-completed">Completed</label>
        </div>
        <menu>
          <button value="cancel" type="reset">Cancel</button>
          <button value="confirm" class="primary">Save</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="main.js"></script>
  </body>
</html>
